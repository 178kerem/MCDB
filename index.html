<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCDB - Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .popular-section h2 {
      text-align: center;  
    }
  </style>
</head>
<body class="background">

  <header>
    <div class="top-bar">
      <button class="menu-btn">☰ Categories</button>
      <h1><a href="index.html" style="text-decoration: none; color: inherit;">MCDB</a></h1>
      <a href="Sign-Login.html" class="login-btn">LOGIN</a>
    </div>
  </header>

  <main>
    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="Search...">
      <div class="toggle-scene" id="searchButton">
        <svg id="cord" width="2" height="100%" viewBox="0 0 2 100" style="stroke:black; stroke-width:2;">
          <line x1="1" y1="0" x2="1" y2="100"></line>
        </svg>
        <div class="bulb">💡</div>
      </div>
    </section>

    <div id="searchResults"></div>

    <section class="popular-section">
      <h2>Popular Movies</h2>
      <div class="movie-list" id="movieList">
        
      </div>
    </section>
    
  </main>

  <script>
    const searchButton = document.getElementById("searchButton");
    const bulb = searchButton.querySelector(".bulb");
    const cord = document.getElementById("cord").querySelector("line");
    let isDragging = false;
    let startY = 0;
  
    bulb.addEventListener("mousedown", (e) => {
      isDragging = true;
      startY = e.clientY;
    });
  
    window.addEventListener("mousemove", (e) => {
      if (isDragging) {
        const diff = e.clientY - startY;
        if (diff > 0 && diff < 200) {  
          bulb.style.top = `calc(90% + ${diff}px)`;
          cord.setAttribute("y2", 100 + diff);  
        }
        if (diff > 50) {  
          startSearch();
          resetBulb();
          isDragging = false;
        }
      }
    });
  
    window.addEventListener("mouseup", () => {
      if (isDragging) {
        resetBulb();
        isDragging = false;
      }
    });
  
    function startSearch() {
      const query = document.getElementById("searchInput").value;
      const apiKey = "b088ca7";  
  
      fetch(`https://www.omdbapi.com/?apikey=${apiKey}&s=${query}`)
        .then(response => response.json())
        .then(data => {
          const resultDiv = document.getElementById("searchResults");
          resultDiv.innerHTML = "";
  
          if (data.Response === "True") {
            data.Search.forEach(movie => {
              const movieHTML = `
                <a href="movie.html?id=${movie.imdbID}" class="movie-card">
                  <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'placeholder.jpg'}" alt="${movie.Title}">
                  <p>${movie.Title} (${movie.Year})</p>
                </a>
              `;
              resultDiv.innerHTML += movieHTML;
            });
          } else {
            resultDiv.innerHTML = "<p>No results found.</p>";
          }
        })
        .catch(error => {
          console.error("Error:", error);
        });
    }
  
    function resetBulb() {
      bulb.style.top = "90%";  
      cord.setAttribute("y2", 100);  
    }

     
    function fetchPopularMovies() {
      const apiKey = "b088ca7";  
      const popularMovieIds = [
        "tt1375666", "tt0816692", "tt0499549", 
        "tt0076759", "tt0133093", "tt0110912"
      ];

      const movieListDiv = document.getElementById("movieList");
      movieListDiv.innerHTML = "";  

      popularMovieIds.forEach(movieId => {
        fetch(`https://www.omdbapi.com/?apikey=${apiKey}&i=${movieId}`)
          .then(response => response.json())
          .then(data => {
            const movieHTML = `
              <a href="movie.html?id=${data.imdbID}" class="movie-card">
                <img src="${data.Poster !== 'N/A' ? data.Poster : 'placeholder.jpg'}" alt="${data.Title}">
                <p>${data.Title} (${data.Year})</p>
              </a>
            `;
            movieListDiv.innerHTML += movieHTML;
          })
          .catch(error => {
            console.error("Error fetching movie:", error);
          });
      });
    }

     
    window.onload = fetchPopularMovies;
  </script>
  
</body>
</html>
