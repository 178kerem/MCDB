<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieSphere - OMDb API ile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #2c3e50, #4789b5);
      color: #f6f1f1;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: rgba(0,0,0,0.7);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .navbar h1 {
      font-weight: 700;
      font-size: 1.8rem;
    }
    .navbar a.login-btn {
      background: #e74c3c;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.3s ease;
    }
    .navbar a.login-btn:hover {
      background: #c0392b;
    }
    .search-section {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }
    .search-section input {
      width: 60%;
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
      gap: 2rem;
      padding: 2rem;
    }
    .movie-card {
      background-color: #1c1c1c;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    .movie-card p {
      margin: 0;
      padding: 1rem;
      font-weight: 500;
      font-size: 1.1rem;
      text-align: center;
    }
    .section-title {
      text-align: center;
      font-size: 1.8rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    #topRatedWrapper, #searchTitle, #movieGrid {
  transition: all 0.3s ease;
}

  </style>
</head>
<body>

  <div class="navbar">
    <h1>🎬 MCDB</h1>
    <a href="login.html" class="login-btn">Sign In</a>
  </div>

  <section class="search-section">
    <input type="text" id="searchInput" placeholder="Search movie..." >
  </section>


  
<div id="topRatedWrapper">
  <h2 class="section-title">Top Rated IMDb Movies</h2>
  <section class="movie-grid" id="topRatedSection"></section>
</div>


<h2 class="section-title" id="searchTitle" style="display: none;">Search Results</h2>
<section class="movie-grid" id="movieGrid"></section>

  <script>
    const apiKey = '88c299de';
    const searchInput = document.getElementById('searchInput');
    const movieGrid = document.getElementById('movieGrid');
    const topRatedSection = document.getElementById('topRatedSection');

    const topRatedIDs = [
      'tt0111161', // The Shawshank Redemption
      'tt0068646', // The Godfather
      'tt0468569', // The Dark Knight
      'tt0071562', // The Godfather Part II
      'tt0108052'  // Schindler's List
    ];

    async function fetchMovieById(id) {
      const res = await fetch(`https://www.omdbapi.com/?apikey=${apiKey}&i=${id}`);
      const data = await res.json();
      return data;
    }

    async function fetchTopMovies() {
      const movies = await Promise.all(topRatedIDs.map(fetchMovieById));
      topRatedSection.innerHTML = '';
      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${movie.Title}" />
          <p>${movie.Title} (${movie.Year})</p>
        `;
        card.onclick = () => {
          window.location.href = `movie.html?id=${movie.imdbID}`;
        };
        topRatedSection.appendChild(card);
      });
    }

    async function fetchMovies(query) {
      const response = await fetch(`https://www.omdbapi.com/?apikey=${apiKey}&s=${encodeURIComponent(query)}&type=movie`);
      const data = await response.json();
      if(data.Response === "True"){
        return data.Search;
      } else {
        return [];
      }
    }

    function renderMovies(list) {
      movieGrid.innerHTML = '';
      if (list.length === 0) {
        movieGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Film bulunamadı.</p>';
        return;
      }
      list.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${movie.Title}" />
          <p>${movie.Title} (${movie.Year})</p>
        `;
        card.onclick = () => {
          window.location.href = `movie.html?id=${movie.imdbID}`;
        };
        movieGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      if(query.length < 3){
        movieGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">En az 3 karakter girin.</p>';
        return;
      }
      const movies = await fetchMovies(query);
      renderMovies(movies);

      topRatedWrapper.style.display = 'none';
  searchTitle.style.display = 'block';
    });

    
    fetchTopMovies();
    



  </script>

</body>
</html>
