<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Detail</title>
  <style>
    body { font-family: Arial, sans-serif; background: #2b2b2b; color: #fff; margin: 0; padding: 0; }
    header { background: #1c1c1c; padding: 20px; display: flex; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .header-title { margin: 0 auto; color: #ffcc00; font-size: 28px; cursor: pointer; }
    .profile-link { color: #ffcc00; font-weight: bold; text-decoration: none; font-size: 16px; }
    #details { padding: 30px; overflow: auto; }
    #details img { width: 200px; height: 300px; object-fit: cover; border-radius: 8px; float: left; margin-right: 20px; }
    #details h2 { color: #ffcc00; margin-top: 0; }
    #details p { margin: 10px 0; line-height: 1.4; }
    .star { font-size: 24px; cursor: pointer; color: #ccc; }
    .star.selected { color: gold; }
    #ratingForm { margin-top: 20px; clear: both; }
    #commentsSection { padding: 30px; clear: both; }
    #commentList .comment { background: #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    #commentForm textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    #commentForm button { margin-top: 10px; padding: 10px 20px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; }
    .comment-rating { margin-top: 8px; }
    .comment-star { font-size: 18px; cursor: pointer; color: #bbb; }
    .comment-star.selected { color: gold; }
    .comment-star.avg { color: #ffdf70; }
    .comment-rating-label { margin-left: 10px; font-size: 14px; color: #ccc; }
    /* Similar Movies */
    #similarSection { padding: 30px; }
    #similarMovies { display: flex; gap: 16px; flex-wrap: wrap; }
    .similar-movie {
      text-align: center;
      width: 110px;
    }
    .similar-movie img {
      width: 90px; height: 130px;
      object-fit: cover;
      border-radius: 6px;
      box-shadow: 0 2px 6px #0003;
      background: #1c1c1c;
    }
    .similar-movie-title {
      margin-top: 8px;
      font-size: 14px;
      color: #ffcc00;
      text-decoration: none;
      display: block;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="header-title" onclick="location.href='index.html'">MCDB</h1>
    <a class="profile-link" id="profileLink" href="login.html">Login</a>
  </header>

  <div id="details"><p>Loading...</p></div>

  <div id="commentsSection">
    <h3 style="color:#ffcc00;">Comments</h3>
    <div id="commentList"></div>
    <form id="commentForm">
      <textarea name="comment" rows="3" placeholder="Write your comment..."></textarea>
      <button type="submit">Post Comment</button>
    </form>
  </div>

  <!-- Similar Movies Section -->
  <div id="similarSection">
    <h3 style="color:#ffcc00;">Similar Movies</h3>
    <div id="similarMovies"></div>
  </div>

  <script>
    let currentUser = null;
    fetch('/me').then(async r => {
      if (r.ok) {
        const user = await r.json();
        currentUser = user;
        const link = document.getElementById('profileLink');
        link.textContent = user.username;
        link.href = 'profile.html';
      }
    });

    const params = new URLSearchParams(window.location.search);
    const movieId = params.get('id');
    let currentMovieName = '';

    if (!movieId) {
      document.getElementById('details').innerHTML = '<p>Movie not found.</p>';
    } else {
      fetchMovieDetail();
    }

    async function fetchMovieDetail() {
      const res = await fetch(`/movie/${movieId}`);
      if (!res.ok) {
        document.getElementById('details').innerHTML = '<p>Loading error.</p>';
        return;
      }
      const m = await res.json();
      renderDetail(m);
    }

    function renderDetail(m) {
      currentMovieName = m.movie_name;
      const c = document.getElementById('details');
      let starsHtml = '';
      // Ortalamayı 0.1 hassasiyetle al
      const avg = Number(m.average_rating) || 0;
      for (let i = 1; i <= 5; i++) {
        let className = "star";
        if (i <= Math.floor(avg)) {
          className += " selected";
        } else if (i - avg < 1 && i > avg) {
          className += " selected";
        }
        starsHtml += `<span class="${className}" data-value="${i}">&#9733;</span>`;
      }
      c.innerHTML = `
        <img src="${m.image_url || ''}" alt="${m.movie_name}">
        <h2>${m.movie_name}</h2>
        <p><strong>Year:</strong> ${m.year} | <strong>Genre:</strong> ${m.genre}</p>
        <p><strong>Director:</strong> ${m.director}</p>
        <p>${m.movie_info}</p>
        <p><strong>MCDB Rating:</strong> <span id="avgRating">${avg || 'Not yet rated'}</span></p>
        <div id="ratingForm">${starsHtml}</div>
      `;

      document.querySelectorAll('#ratingForm .star').forEach(s => {
        s.addEventListener('click', async () => {
          const val = Number(s.dataset.value);
          document.querySelectorAll('#ratingForm .star').forEach(x =>
            x.classList.toggle('selected', Number(x.dataset.value) <= val)
          );
          const auth = await fetch('/me');
          if (!auth.ok) return alert('Please login first.');
          await fetch('/rate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ movie_id: movieId, starpoint: val })
          });
          const upd = await fetch(`/movie/${movieId}`);
          if (upd.ok) {
            const data = await upd.json();
            document.getElementById('avgRating').textContent = data.average_rating || 'Not yet rated';
            renderDetail(data);
          }
          fetchComments(currentMovieName);
        });
      });

      fetchComments(currentMovieName);

      // Similar Movies kısmını çağır
      fetchSimilarMovies(m.genre, m.id);
    }

    async function fetchComments(movieName) {
      const res = await fetch(`/comments?movie_name=${encodeURIComponent(movieName)}`);
      if (!res.ok) return;
      const list = await res.json();
      const container = document.getElementById('commentList');
      container.innerHTML = '';
      list.forEach(cmt => {
        const div = document.createElement('div');
        div.className = 'comment';
        div.innerHTML = `
          <strong>${cmt.username}</strong>: ${cmt.comment}
          <div class="comment-rating" data-comment-id="${cmt.id}"></div>
        `;
        container.appendChild(div);

        
        renderCommentStars(
          div.querySelector('.comment-rating'),
          cmt.id,
          cmt.avg_starpoint,
          cmt.my_starpoint
        );
      });
    }

    function renderCommentStars(container, commentId, avg, my) {
      const stars = [];
      const userCanRate = !!currentUser;
      const userVal = my ? Number(my) : 0;
      for (let i = 1; i <= 5; i++) {
        const starClass = [
          'comment-star',
          userVal >= i ? 'selected' : '',
          !userVal && avg >= i ? 'avg' : ''
        ].join(' ');
        stars.push(`<span class="${starClass.trim()}" data-value="${i}">&#9733;</span>`);
      }
      let label = '';
      if (avg) label += `<span class="comment-rating-label">mcdb comment rate: ${avg}</span>`;
      if (userVal) label += `<span class="comment-rating-label">(You rate: ${userVal})</span>`;

      container.innerHTML = stars.join('') + label;

      if (userCanRate) {
        container.querySelectorAll('.comment-star').forEach(star => {
          star.style.cursor = 'pointer';
          star.onclick = async function () {
            const auth = await fetch('/me');
            if (!auth.ok) {
              alert('Please login first.');
              return;
            }
            const val = Number(this.dataset.value);
            await fetch('/rate-comment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ comment_id: commentId, starpoint: val })
            });
            fetchComments(currentMovieName);
          };
        });
      }
    }

    document.getElementById('commentForm').addEventListener('submit', async e => {
      e.preventDefault();
      const comment = e.target.comment.value.trim();
      if (!comment) return;
      const auth = await fetch('/me');
      if (!auth.ok) return alert('Please login first.');
      await fetch('/comment', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ movie_name: currentMovieName, comment })
      });
      e.target.reset();
      fetchComments(currentMovieName);
    });

    
    async function fetchSimilarMovies(genre, excludeId) {
      const similarDiv = document.getElementById('similarMovies');
      similarDiv.innerHTML = '<p>Loading...</p>';
      if (!genre) {
        similarDiv.innerHTML = '<p>No similar movies found.</p>';
        return;
      }
      
      const mainGenre = genre.split(',')[0].trim();
      const res = await fetch(`/similar-movies?genre=${encodeURIComponent(mainGenre)}&exclude=${excludeId}`);
      if (!res.ok) {
        similarDiv.innerHTML = '<p>No similar movies found.</p>';
        return;
      }
      const movies = await res.json();
      if (!movies.length) {
        similarDiv.innerHTML = '<p>No similar movies found.</p>';
        return;
      }
      similarDiv.innerHTML = movies.map(m =>
        `<div class="similar-movie">
          <a href="movie.html?id=${m.id}" class="similar-movie-title">
            <img src="${m.image_url || ''}" alt="${m.movie_name}" />
            ${m.movie_name}
          </a>
        </div>`
      ).join('');
    }
  </script>
</body>
</html>
