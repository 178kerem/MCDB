<!-- movie.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="background">
  <header class="top-bar">
    <a href="index.html">← Back to Search</a>
    <h1 id="movie-title">Movie Title</h1>
  </header>

  <main class="movie-page">
    <div class="left-panel">
      <img id="movie-poster" src="" alt="Poster" />
    </div>
    <div class="middle-panel">
      <div class="movie-info-box">
        <h2>Movie Information</h2>
        <p id="movie-plot"></p>
        <p><strong>Year:</strong> <span id="movie-year"></span></p>
        <p><strong>Genre:</strong> <span id="movie-genre"></span></p>
        <p><strong>Director:</strong> <span id="movie-director"></span></p>
        <p><strong>Actors:</strong> <span id="movie-actors"></span></p>
      </div>
    </div>
    <div class="right-panel">
      <h3>MCDb Rating</h3>
      <p>⭐ <span id="movie-rating">N/A</span></p>
      <a href="#" class="similar-movies">Similar movies →</a>
    </div>
  </main>

  <section class="comments-section">
    <h3>Comments</h3>
    <div class="comment-box">
      <p><strong>Adem:</strong><br>Çok güzel film</p>
      <p><strong>Kerim:</strong><br>Great movie! I strongly suggest to watch.</p>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const movieId = params.get('id');
    const apiKey = "b088ca7";

    fetch(`https://www.omdbapi.com/?apikey=${apiKey}&i=${movieId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('movie-title').textContent = data.Title;
        document.getElementById('movie-poster').src = data.Poster !== 'N/A' ? data.Poster : 'placeholder.jpg';
        document.getElementById('movie-year').textContent = data.Year;
        document.getElementById('movie-genre').textContent = data.Genre;
        document.getElementById('movie-director').textContent = data.Director;
        document.getElementById('movie-actors').textContent = data.Actors;
        document.getElementById('movie-plot').textContent = data.Plot;
        document.getElementById('movie-rating').textContent = data.imdbRating;
      });
  </script>
</body>
</html>
