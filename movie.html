<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MovieSphere - Film Detay</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #2c3e50, #3498db);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background-color: #1c1c1c;
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      color: #eee;
    }
    .poster {
      flex: 1 1 300px;
      max-width: 300px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.7);
    }
    .poster img {
      width: 100%;
      display: block;
    }
    .details {
      flex: 2 1 500px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h1 {
      margin: 0;
      font-weight: 700;
      font-size: 2rem;
      color: #f39c12;
    }
    p {
      margin: 0;
      line-height: 1.5;
      font-size: 1rem;
    }
    .back-btn {
      margin-bottom: 2rem;
      align-self: flex-start;
      background: #f39c12;
      border: none;
      color: #1c1c1c;
      font-weight: 700;
      padding: 0.7rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(243,156,18,0.5);
      transition: background-color 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover {
      background: #e67e22;
      color: #fff;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      .poster, .details {
        max-width: 100%;
        flex: 1 1 100%;
      }
    }
    .star-rating {
  display: flex;
  gap: 4px;
  font-size: 1.5rem;
  color: #ddd;
  user-select: none;
}

.star-rating > span {
  position: relative;
  cursor: default;
  width: 1.5rem;
  display: inline-block;
  color: #ddd;
}

.star-rating > span.full {
  color: #f39c12;
}

.star-rating > span.half {
  color: #ddd;
}

.star-rating > span.half::before {
  content: "★";
  color: #f39c12;
  position: absolute;
  width: 50%;
  overflow: hidden;
  left: 0;
  top: 0;
}


  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Go Back</a>

  <div class="container" id="movieContainer">
    
  </div>

  <script>
    const apiKey = '88c299de'; 

   
    const urlParams = new URLSearchParams(window.location.search);
    const imdbID = urlParams.get('id');

    const container = document.getElementById('movieContainer');

    async function fetchMovieDetails(id) {
      try {
        const res = await fetch(`https://www.omdbapi.com/?apikey=${apiKey}&i=${id}&plot=full`);
        const data = await res.json();
        if(data.Response === "True"){
          return data;
        } else {
          throw new Error(data.Error);
        }
      } catch(err) {
        console.error(err);
        return null;
      }
    }

    function renderMovie(movie) {
      if(!movie){
        container.innerHTML = '<p>Movie information not found.</p>';
;
        return;
      }

      container.innerHTML = `
        <div class="poster">
          <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${movie.Title}" />
        </div>
        <div class="details">
          <h1>${movie.Title} (${movie.Year})</h1>
          <p><strong>Genre:</strong> ${movie.Genre}</p>
          <p><strong>Director:</strong> ${movie.Director}</p>
          <p><strong>Stars:</strong> ${movie.Actors}</p>
          <p><strong>Runtime:</strong> ${movie.Runtime}</p>
          <p><strong>IMDB Rating:</strong> ${movie.imdbRating} / 10 ${getStarRating(movie.imdbRating)}</p>
          <p><strong>Plot Summary:</strong> ${movie.Plot}</p>
          <p><strong>Release Date:</strong> ${movie.Released}</p>
          <p><strong>Language:</strong> ${movie.Language}</p>
          <p><strong>Country:</strong> ${movie.Country}</p>
          <p><strong>Awards:</strong> ${movie.Awards}</p>
        </div>
      `;
    }

    if(!imdbID){
      container.innerHTML = '<p>A valid movie ID could not be found.</p>';
    } else {
      fetchMovieDetails(imdbID).then(renderMovie);
    }

    function getStarRating(imdbRating) {
  const maxStars = 5;
  const rating = parseFloat(imdbRating);
  if (isNaN(rating)) return '';

  const stars = rating / 2; 

  const fullStars = Math.floor(stars);
  const halfStar = (stars - fullStars) >= 0.5 ? 1 : 0;
  const emptyStars = maxStars - fullStars - halfStar;

  let starHTML = '<span class="star-rating">';
  for (let i = 0; i < fullStars; i++) {
    starHTML += '<span class="full">★</span>';
  }
  if (halfStar) {
    starHTML += '<span class="half">★</span>';  
  }
  for (let i = 0; i < emptyStars; i++) {
    starHTML += '<span class="empty">☆</span>';
  }
  starHTML += '</span>';

  return starHTML;
}




  </script>

</body>
</html>
