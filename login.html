<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş / Kayıt - MovieSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
   
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-box {
      text-align: center;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      color: #fff;
    }

    .auth-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .auth-box input {
      width: 92%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }

    .auth-box button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(255,75,43,0.5);
    }

    .auth-box .toggle {
      background: linear-gradient(90deg, #1e3c72, #2a5298);
    }

    .auth-box .message {
      text-align: center;
      margin-top: 10px;
      color: #ffdede;
    }

    .go-back {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.2rem;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a href="index.html" class="go-back">⟵ Main Page</a>
  <div class="auth-box">
    <h2 id="formTitle">Login</h2>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="confirmPassword" style="display: none;">
    <button onclick="handleAuth()" id="submitBtn">Log In</button>
    <button class="toggle" onclick="toggleForm()" id="toggleForm">Create Account</button>
    <div class="message" id="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHVf0hw5VreBnTeKSaDoTf-TvOsiv7tCM",
      authDomain: "mcdb-affa0.firebaseapp.com",
      projectId: "mcdb-affa0",
      storageBucket: "mcdb-affa0.appspot.com",
      messagingSenderId: "464835210126",
      appId: "1:464835210126:web:e3f34aba48cc4faff252df",
      measurementId: "G-CB8HK6VM83"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLogin = true;

    window.toggleForm = function () {
      isLogin = !isLogin;
      document.getElementById("formTitle").innerText = isLogin ? "Log In" : "Create Account";
      document.getElementById("submitBtn").innerText = isLogin ? "Log In" : "Create Account";
      document.getElementById("toggleForm").innerText = isLogin ? "Create Account" : "Log In";
      document.getElementById("confirmPassword").style.display = isLogin ? "none" : "block";
      document.getElementById("message").innerText = "";
    }

    window.handleAuth = function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const messageDiv = document.getElementById("message");

      if (!email || !password || (!isLogin && !confirmPassword)) {
        messageDiv.innerText = "All fields are required.";
        return;
      }

      if (!isLogin && password !== confirmPassword) {
        messageDiv.innerText = "Passwords do not match.";
        return;
      }

      if (isLogin) {
        signInWithEmailAndPassword(auth, email, password)
          .then(() => {
            messageDiv.style.color = "#aef3c6";
            messageDiv.innerText = "Redirecting...";
            setTimeout(() => window.location.href = "index.html", 1500);
          })
          .catch(error => {
            messageDiv.innerText = error.message;
          });
      } else {
        createUserWithEmailAndPassword(auth, email, password)
          .then(() => {
            messageDiv.style.color = "#aef3c6";
            messageDiv.innerText = "Registration successful. You can now log in.";
            toggleForm();
          })
          .catch(error => {
            messageDiv.innerText = error.message;
          });
      }
    }
  </script>
</body>
</html>
